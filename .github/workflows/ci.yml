name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for previous commits on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check modified paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'src/**'
              - 'server/**'
              - 'functions/**'
              - 'public/**'
              - 'index.html'
              - 'wrangler.json'
              - 'package.json'
              - 'yarn.lock'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            migrations:
              - 'supabase/**'
              - '.github/workflows/ci.yml'

  validate:
    name: Typecheck & Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript Type Check
        run: yarn typecheck

      - name: Run Unit & Integration Tests
        run: yarn test
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Vite Production Build
        run: yarn build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Upload Build Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  test-migrations:
    name: Verify Supabase Migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Ephemeral Local Supabase Stack
        run: supabase start

      - name: Replay All Migrations Cleanly
        run: supabase db reset
